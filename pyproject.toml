[project]
name = "abx"
version = "0.1.0"
description = "ABX evaluation (ZeroSpeech 2021 triphones, Prosodic ABX stress) of self-supervised speech models, layer by layer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastabx>=0.9.0,<0.10",  # src/tasks.py uses fastabx.dataset.read_labels (not exported)
    "huggingface-hub>=1.31,<2",
    "internal-tools",
    "ipykernel>=7.4.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "soundfile>=0.14.0",
    "torchaudio>=2.11.0",
    "transformers>=5",
]

[tool.uv.sources]
internal-tools = { path = "external/internal_tools", editable = true }

